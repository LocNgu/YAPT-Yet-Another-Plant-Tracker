# Robolectric instantiates the manifest's Application for every unit test, and YaptApplication.onCreate()
# fires off app-start background work (the #702 SeasonalGraduationFixup) on Dispatchers.IO against a
# process-wide Room singleton. That raced test fixtures and made SkipWateringReceiverTest's ADR-0007
# invariant guard fail intermittently (#757) — TestYaptApplication is the real application minus that
# fire-and-forget launch.
#
# This file is an explicit, greppable registration, NOT the only thing that selects TestYaptApplication:
# Robolectric's AndroidTestEnvironment resolves `Test` + <manifest application simple name> in the same
# package first, falling back to the manifest class only when no such class exists (verified in
# robolectric-4.16.1 bytecode and by deleting this file — the tests still get TestYaptApplication). So
# the class NAME is load-bearing on its own; this file makes the wiring visible and survives renaming
# the class off that convention. A bogus class name here fails loudly, so it is not inert.
application=com.yapt.planttracker.TestYaptApplication
