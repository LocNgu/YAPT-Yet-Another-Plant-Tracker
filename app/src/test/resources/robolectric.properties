# Robolectric instantiates the manifest's Application for every unit test, and YaptApplication.onCreate()
# fires off app-start background work (the #702 SeasonalGraduationFixup) on Dispatchers.IO against a
# process-wide Room singleton. That raced test fixtures and made SkipWateringReceiverTest's ADR-0007
# invariant guard fail intermittently (#757) — TestYaptApplication is the real application minus that
# fire-and-forget launch. Module-wide on purpose: any Robolectric test can insert plants, so a per-class
# opt-in would be one forgotten annotation away from the same flake.
application=com.yapt.planttracker.TestYaptApplication
