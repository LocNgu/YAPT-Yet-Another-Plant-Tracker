name: Android CI/CD

on:
  # Only build on direct pushes to main (post-merge release builds). All develop
  # work goes through PRs, which the pull_request trigger already covers — this
  # avoids the double CI run when a develop → main release PR is open, where a push
  # to develop would otherwise fire both `push` (develop) and `pull_request`
  # (synchronize) events. See #260.
  push:
    branches: [ main ]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      instrumented: ${{ steps.filter.outputs.instrumented }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'app/src/**'
              - 'app/build.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/**'
            instrumented:
              - 'app/src/androidTest/**'
              - 'app/src/main/**'
              - 'app/build.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'

  test:
    name: Unit Tests & Lint
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.app == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Decode debug keystore
        # Dependabot (and fork) PR runs don't receive Actions secrets, so the
        # secret resolves to an empty string and a naive decode would write a
        # 0-byte keystore that keytool rejects ("Tag number over 30 is not
        # supported"). Guard in the shell rather than in `if:` — the `secrets`
        # context is NOT allowed in step `if:` conditionals (it's a workflow
        # validation error that fails the whole run at startup with 0 jobs), so
        # the secret is mapped to env and checked with the shell. When it's
        # absent, build.gradle.kts falls back to AGP's auto-generated debug key.
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          else
            echo "No debug keystore secret (Dependabot/fork PR); AGP will use its auto-generated debug key."
          fi

      - name: Run Detekt
        run: gradle detekt --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Run lint
        run: gradle lintDebug --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          retention-days: 7

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Decode debug keystore
        # Dependabot (and fork) PR runs don't receive Actions secrets, so the
        # secret resolves to an empty string and a naive decode would write a
        # 0-byte keystore that keytool rejects ("Tag number over 30 is not
        # supported"). Guard in the shell rather than in `if:` — the `secrets`
        # context is NOT allowed in step `if:` conditionals (it's a workflow
        # validation error that fails the whole run at startup with 0 jobs), so
        # the secret is mapped to env and checked with the shell. When it's
        # absent, build.gradle.kts falls back to AGP's auto-generated debug key.
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          else
            echo "No debug keystore secret (Dependabot/fork PR); AGP will use its auto-generated debug key."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) && '5' || '1' }}

  instrumented:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' && needs.changes.outputs.instrumented == 'true')
    concurrency:
      group: instrumented-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Decode debug keystore
        # Dependabot (and fork) PR runs don't receive Actions secrets, so the
        # secret resolves to an empty string and a naive decode would write a
        # 0-byte keystore that keytool rejects ("Tag number over 30 is not
        # supported"). Guard in the shell rather than in `if:` — the `secrets`
        # context is NOT allowed in step `if:` conditionals (it's a workflow
        # validation error that fails the whole run at startup with 0 jobs), so
        # the secret is mapped to env and checked with the shell. When it's
        # absent, build.gradle.kts falls back to AGP's auto-generated debug key.
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          else
            echo "No debug keystore secret (Dependabot/fork PR); AGP will use its auto-generated debug key."
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: gradle connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results-${{ github.sha }}
          path: app/build/reports/androidTests/connected/
          retention-days: 7

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: instrumented
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Run release unit tests
        run: gradle testReleaseUnitTest --no-daemon
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Run release lint
        run: gradle lintRelease --no-daemon
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload release test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results-${{ github.sha }}
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.html
          retention-days: 7

      - name: Read version
        id: version
        run: |
          source version.properties
          echo "name=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
          echo "tag=v$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" &>/dev/null; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping."
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              app/build/outputs/apk/release/app-release.apk \
              --title "YAPT ${{ steps.version.outputs.name }}" \
              --target "${{ github.sha }}" \
              --generate-notes
          fi
