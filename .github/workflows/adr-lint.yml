name: ADR Lint

# Deliberately separate from android.yml. This check needs no JDK and must also
# run on docs-only PRs, where android.yml's path-filtered Android jobs are
# skipped. android.yml does run on develop pushes now (#941, technical ADR-0039),
# but only for the Android jobs; this workflow stays its own cheap, fast check.
#
# Both triggers are needed. The pull_request run is where a collision is cheap
# to fix, before merge. It cannot catch the interleaving case: two PRs each add
# ADR-0042, each is green against develop at the time it ran, and GitHub does
# not re-run the second after the first merges unless branch protection
# requires the branch be up to date. The develop push run closes that gap.
on:
  pull_request:
  push:
    branches: [ develop ]

jobs:
  adr:
    name: ADR numbering & citations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test the checker
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Check ADR numbering and citations
        run: python3 tools/check-adr-numbering.py
