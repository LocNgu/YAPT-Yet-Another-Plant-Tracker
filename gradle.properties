org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9.0 defaults `onlyEnableUnitTestForTheTestedBuildType` to true, which stops
# creating unit-test tasks for non-tested build types (i.e. `testReleaseUnitTest`
# no longer exists). The release CI job runs `testReleaseUnitTest`, so restore the
# pre-AGP-9 behaviour of generating unit-test tasks for the release build type too.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Reuse compile/KSP/dex outputs across builds. In CI, only develop pushes write the Gradle
# cache, which includes this build cache; PR runs restore it read-only (#941, technical
# ADR-0039). Test tasks opt out in app/build.gradle.kts.
org.gradle.caching=true
